name: Sync docs to wiki

# The wiki is a generated mirror of docs/. Edit docs/ via pull requests;
# this publishes them to the GitHub wiki on every merge to main.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    steps:
      - uses: actions/checkout@v4

      - name: Trust workspace
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Publish docs/ to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@50650fccf3a10f741995523cf9708c53cec8912a # v4
        with:
          path: docs/
