name: Experimental COSE-HPKE

on:
  push:
    branches: [ 'main', 'release/**', 'ci/ghcr-ci-image' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  discover:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  cose-hpke:
    name: HPKE P0 (${{ matrix.wolfssl-ref }})
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci:latest
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.discover.outputs.refs) }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Trust workspace
      if: runner.os == 'Linux'
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Build HPKE-enabled wolfSSL
      run: |
        git clone --depth 1 --branch "${{ matrix.wolfssl-ref }}" \
          https://github.com/wolfSSL/wolfssl.git "$HOME/wolfssl"
        cd "$HOME/wolfssl"
        ./autogen.sh
        CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
        LDFLAGS="-fsanitize=address" \
        ./configure --enable-ecc --enable-ed25519 --enable-ed448 \
                    --enable-curve25519 --enable-curve448 \
                    --enable-ecccustcurves=all \
                    --enable-aesgcm --enable-aesccm \
                    --enable-sha384 --enable-sha512 \
                    --enable-keygen --enable-hkdf --enable-aeskeywrap \
                    --enable-chacha --enable-poly1305 --enable-mldsa \
                    --enable-rsapss --enable-hpke \
                    --prefix="$HOME/wolfssl-install"
        make -j"$(nproc)"
        make install

    - name: Run experimental HPKE unit tests
      run: |
        export WOLFSSL_DIR="$HOME/wolfssl-install"
        export LD_LIBRARY_PATH="$WOLFSSL_DIR/lib"
        HPKE_FLAGS="-DWOLFCOSE_EXPERIMENTAL \
          -DWOLFCOSE_ENABLE_HPKE_0_ENCRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_DECRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_KE_ENCRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_KE_DECRYPT"
        WOLFCOSE_CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 \
          -Og -g -fsanitize=address -fno-omit-frame-pointer \
          -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wvla \
          -Werror=vla -DHAVE_ECC_KOBLITZ -I./include \
          -I$WOLFSSL_DIR/include $HPKE_FLAGS"
        make clean
        make test CFLAGS="$WOLFCOSE_CFLAGS" \
          LDFLAGS="-fsanitize=address -L$WOLFSSL_DIR/lib -lwolfssl"

    - name: Run experimental HPKE example
      run: |
        export WOLFSSL_DIR="$HOME/wolfssl-install"
        export LD_LIBRARY_PATH="$WOLFSSL_DIR/lib"
        WOLFCOSE_CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 \
          -Og -g -fsanitize=address -fno-omit-frame-pointer \
          -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wvla \
          -Werror=vla -I./include -I$WOLFSSL_DIR/include"
        make clean
        make hpke-demo CFLAGS="$WOLFCOSE_CFLAGS" \
          LDFLAGS="-fsanitize=address -L$WOLFSSL_DIR/lib -lwolfssl"

    - name: Run experimental HPKE strict C99 check
      run: |
        export WOLFSSL_DIR="$HOME/wolfssl-install"
        make c99-hpke-check WOLFSSL_INC="$WOLFSSL_DIR/include"

    - name: Run experimental HPKE CLI commands
      run: |
        export WOLFSSL_DIR="$HOME/wolfssl-install"
        export LD_LIBRARY_PATH="$WOLFSSL_DIR/lib"
        HPKE_FLAGS="-DWOLFCOSE_EXPERIMENTAL \
          -DWOLFCOSE_ENABLE_HPKE_0_ENCRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_DECRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_KE_ENCRYPT \
          -DWOLFCOSE_ENABLE_HPKE_0_KE_DECRYPT"
        WOLFCOSE_CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 \
          -Og -g -fsanitize=address -fno-omit-frame-pointer \
          -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wvla \
          -Werror=vla -I./include -I$WOLFSSL_DIR/include $HPKE_FLAGS"
        make clean
        EXPECT_HPKE=true EXPECT_PQC=true make cmdline-test \
          CFLAGS="$WOLFCOSE_CFLAGS" \
          LDFLAGS="-fsanitize=address -L$WOLFSSL_DIR/lib -lwolfssl"
