name: House Style

on:
  push:
    branches: [ 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  house-style:
    name: wolfCOSE house-style conventions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trust workspace
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check conventions (no goto, C-style comments, banner style, no tabs/trailing space)
        run: sh scripts/check_house_style.sh
