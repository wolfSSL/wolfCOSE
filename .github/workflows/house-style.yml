name: House Style

on:
  push:
    branches: [ 'main', 'release/**', 'ci/ghcr-ci-image' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  house-style:
    name: wolfCOSE house-style conventions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci:latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check conventions (no goto, C-style comments, banner style, no tabs/trailing space)
        run: sh scripts/check_house_style.sh
