name: Code Coverage

on:
  push:
    branches: [ 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Line Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool lcov

    - name: Resolve wolfSSL master commit
      id: wolfssl-rev
      run: echo "sha=$(git ls-remote https://github.com/wolfSSL/wolfssl.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wolfSSL
      id: cache-wolfssl
      uses: actions/cache@v4
      with:
        path: ~/wolfssl-install
        # Coverage needs its own cache: other workflows share the generic
        # ubuntu-latest key but configure wolfSSL without aeskeywrap, and a
        # cache hit on such a build silently skips the KEY_WRAP tests.
        key: wolfssl-coverage-fullcfg-v1-${{ steps.wolfssl-rev.outputs.sha }}

    - name: Build wolfSSL
      if: steps.cache-wolfssl.outputs.cache-hit != 'true'
      run: |
        cd ~
        git clone --depth 1 https://github.com/wolfSSL/wolfssl.git
        cd wolfssl
        ./autogen.sh
        # Coverage thresholds (99%/100%) require the ML-DSA paths compiled in,
        # so build against master with the PQC/experimental wc_MlDsaKey API.
        ./configure --enable-ecc --enable-ed25519 --enable-ed448 \
                    --enable-curve25519 --enable-aesgcm --enable-aesccm \
                    --enable-sha384 --enable-sha512 --enable-keygen \
                    --enable-rsapss --enable-chacha --enable-poly1305 \
                    --enable-mldsa \
                    --enable-hkdf --enable-aeskeywrap \
                    --enable-aescbc \
                    --prefix=$HOME/wolfssl-install
        make -j$(nproc)
        make install

    - name: Run coverage with failure injection
      run: |
        export WOLFSSL_DIR=$HOME/wolfssl-install
        export LD_LIBRARY_PATH=$WOLFSSL_DIR/lib
        make coverage-force-failure CC=gcc \
          CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 -Os -Wall -Wextra -Wpedantic -Wshadow -Wconversion -I./include -isystem $WOLFSSL_DIR/include" \
          LDFLAGS="-L$WOLFSSL_DIR/lib -lwolfssl"

    - name: Check coverage thresholds
      run: |
        echo "=============================================="
        echo "         wolfCOSE Coverage Report"
        echo "=============================================="
        echo ""

        # Every wolfCOSE source file must have 100% line coverage.

        FAILED=0

        GCOV_OUTPUT=$(gcov src/*.c 2>&1)
        echo "$GCOV_OUTPUT"
        echo ""

        for f in src/*.c; do
          BASE=$(basename "$f")
          PCT=$(echo "$GCOV_OUTPUT" | grep -A1 "File '$f'" | grep "Lines executed" | sed "s/.*:\([0-9.]*\)%.*/\1/")
          UNCOV=$(grep -c "#####" "$BASE.gcov" 2>/dev/null || echo "0")

          if [ -z "$PCT" ]; then
            FAILED=1
            echo ">>> FAILED: no gcov result for $BASE <<<"
            continue
          fi

          echo "$BASE:"
          echo "  Coverage: ${PCT}%"
          echo "  Threshold: 100%"
          echo "  Uncovered lines: ${UNCOV}"

          if awk "BEGIN {exit !($PCT < 100)}"; then
            FAILED=1
            echo ">>> FAILED: $BASE coverage is below 100%! <<<"
            echo ""
            echo "Uncovered lines in $BASE:"
            echo "------------------------------"
            grep -n "#####" "$BASE.gcov" | head -50
          else
            echo ">>> PASSED: $BASE meets 100% threshold <<<"
          fi
          echo ""
        done

        echo "=============================================="

        if [ "$FAILED" -eq 1 ]; then
          echo ""
          echo "  Looks like you need more tests!"
          echo ""
          echo "  Add tests to tests/test_cose.c to cover the"
          echo "  uncovered lines shown above."
          echo ""
          echo "=============================================="
          exit 1
        fi

        echo "  All coverage thresholds passed!"
        echo "=============================================="
