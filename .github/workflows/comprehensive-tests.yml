name: Comprehensive Tests

on:
  push:
    branches: [ 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  discover:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  comprehensive:
    name: Algorithm Matrix Tests (wolfSSL ${{ matrix.wolfssl-version }})
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Trust workspace
      if: runner.os == 'Linux'
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Cache wolfSSL (${{ matrix.wolfssl-version }})
      if: matrix.wolfssl-version != 'master'
      id: cache-wolfssl
      uses: actions/cache@v4
      with:
        path: ~/wolfssl-install
        key: wolfcose-ci-v1-wolfssl-comprehensive-${{ matrix.wolfssl-version }}-v1

    - name: Build wolfSSL (${{ matrix.wolfssl-version }})
      if: matrix.wolfssl-version == 'master' || steps.cache-wolfssl.outputs.cache-hit != 'true'
      env:
        PQC: ${{ matrix.pqc }}
      run: |
        cd ~
        git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} \
            https://github.com/wolfSSL/wolfssl.git
        cd wolfssl
        ./autogen.sh
        if [ "$PQC" = "true" ]; then
          PQC_FLAGS="--enable-mldsa"
        else
          PQC_FLAGS=""
        fi
        ./configure --enable-ecc --enable-ed25519 --enable-ed448 \
                    --enable-curve25519 --enable-aesgcm --enable-aesccm \
                    --enable-sha384 --enable-sha512 --enable-keygen \
                    --enable-rsapss --enable-chacha --enable-poly1305 \
                    $PQC_FLAGS --enable-hkdf --enable-aeskeywrap \
                    --prefix=$HOME/wolfssl-install
        make -j$(nproc)
        make install

    - name: Build wolfCOSE
      run: |
        export WOLFSSL_DIR=$HOME/wolfssl-install
        make CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 -Os -Wall -Wextra -Wpedantic -Wshadow -Wconversion -fstack-usage -I./include -isystem $WOLFSSL_DIR/include" \
             LDFLAGS="-L$WOLFSSL_DIR/lib -lwolfssl"

    - name: Run comprehensive tests
      run: |
        export WOLFSSL_DIR=$HOME/wolfssl-install
        export LD_LIBRARY_PATH=$WOLFSSL_DIR/lib
        make comprehensive CFLAGS="-std=c99 -DHAVE_ANONYMOUS_INLINE_AGGREGATES=1 -Os -Wall -Wextra -Wpedantic -Wshadow -Wconversion -fstack-usage -I./include -isystem $WOLFSSL_DIR/include" \
                           LDFLAGS="-L$WOLFSSL_DIR/lib -lwolfssl"

    - name: Test Summary
      if: always()
      run: |
        echo "=== Comprehensive Test Summary ==="
        echo "Tests cover all algorithm combinations for:"
        echo "  - COSE_Sign1 and COSE_Sign (multi-signer)"
        echo "  - COSE_Encrypt0 and COSE_Encrypt (multi-recipient)"
        echo "  - COSE_Mac0 and COSE_Mac (multi-recipient)"
        echo "  - Error handling and edge cases"
