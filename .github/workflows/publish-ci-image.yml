name: Publish CI image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/wolfcose-ci/**'
      - '.github/workflows/publish-ci-image.yml'
      - 'tests/interop/python_cwt/requirements.txt'
  pull_request:
    paths:
      - '.github/docker/wolfcose-ci/**'
      - '.github/workflows/publish-ci-image.yml'
      - 'tests/interop/python_cwt/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-image-pr-{0}', github.event.pull_request.number) || 'publish-ci-image' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build CI image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/wolfcose-ci/Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          cache-from: type=registry,ref=ghcr.io/wolfssl/wolfcose-ci:latest

  publish:
    name: Publish CI image
    if: github.repository == 'wolfSSL/wolfCOSE' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/wolfcose-ci/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/wolfssl/wolfcose-ci:latest
            ghcr.io/wolfssl/wolfcose-ci:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/wolfssl/wolfcose-ci:latest
          cache-to: type=inline

  smoke:
    name: Test published CI image
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci:latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise installed tools
        run: wolfcose-ci-smoke
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check wiki publishing dependencies
        uses: Andrew-Chen-Wang/github-wiki-action@50650fccf3a10f741995523cf9708c53cec8912a # v4
        with:
          path: docs/
          dry-run: true
