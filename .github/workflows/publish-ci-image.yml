name: Publish CI image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/wolfcose-ci/**'
      - '.github/workflows/publish-ci-image.yml'
      - 'tests/interop/python_cwt/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ci-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CI image
    if: github.repository == 'wolfSSL/wolfCOSE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/wolfcose-ci/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/wolfssl/wolfcose-ci:latest
            ghcr.io/wolfssl/wolfcose-ci:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/wolfssl/wolfcose-ci:latest
          cache-to: type=inline

  smoke:
    name: Test published CI image
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@${{ needs.publish.outputs.digest }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise installed tools
        run: wolfcose-ci-smoke
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check wiki publishing dependencies
        uses: Andrew-Chen-Wang/github-wiki-action@50650fccf3a10f741995523cf9708c53cec8912a # v4
        with:
          path: docs/
          dry-run: true
